<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeoAnki</title>
  <style>
    :root {
      --bg: #07090f;
      --glass: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.14);
      --accent1: #a78bfa;
      --accent2: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --good: #34d399;
      --hard: #fbbf24;
      --again: #fb7185;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Arabic", system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.42;
      z-index: 0;
      pointer-events: none;
    }
    .orb-a { width: 240px; height: 240px; background: var(--accent1); top: -50px; right: -50px; }
    .orb-b { width: 220px; height: 220px; background: var(--accent2); bottom: -40px; left: -50px; }

    .app {
      position: relative;
      z-index: 1;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: 20px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
    }

    .brand { font-weight: 800; font-size: 18px; letter-spacing: 0.4px; }
    .stats { font-size: 13px; color: var(--muted); }

    .glass-card {
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(22px) saturate(150%);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .front-box { font-size: 24px; font-weight: 700; text-align: center; padding: 24px 8px; }
    .back-box {
      font-size: 20px;
      text-align: center;
      padding: 18px 8px;
      border-top: 1px solid var(--border);
      margin-top: 12px;
      color: #e2e8f0;
    }

    .btn-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 12px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary { background: linear-gradient(135deg, var(--accent1), var(--accent2)); color: #06080d; border: none; }
    .again { border-color: rgba(251, 113, 133, 0.4); color: var(--again); }
    .hard { border-color: rgba(251, 191, 36, 0.4); color: var(--hard); }
    .good { border-color: rgba(52, 211, 153, 0.4); color: var(--good); }

    input, textarea {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font-size: 15px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <div class="app">
    <header>
      <div class="brand">NeoAnki</div>
      <div class="stats" id="stats">بطاقات مستحقة: 0</div>
    </header>

    <div class="glass-card" id="study-panel">
      <div class="front-box" id="card-front">لا توجد بطاقات مستحقة حالياً</div>
      <div class="back-box hidden" id="card-back"></div>
      <button class="primary" id="show-btn" style="width:100%" onclick="revealAnswer()">إظهار الإجابة</button>
      <div class="btn-row hidden" id="rate-row">
        <button class="again" onclick="rateCard('again')">تاني (10 د)</button>
        <button class="hard" onclick="rateCard('hard')">صعب (12 س)</button>
        <button class="good" onclick="rateCard('good')">تمام (1 ي)</button>
      </div>
    </div>

    <div class="glass-card">
      <div style="font-weight:700; margin-bottom:6px;">إضافة بطاقة جديدة</div>
      <input id="q-input" placeholder="الوجه الأمامي (سؤال أو كلمة)" />
      <textarea id="a-input" rows="2" placeholder="الوجه الخلفي (الإجابة أو المعنى)"></textarea>
      <button class="primary" style="width:100%; margin-top:10px;" onclick="addCard()">حفظ البطاقة</button>
    </div>
  </div>

  <script>
    const DAY = 86400000;
    let cards = JSON.parse(localStorage.getItem('neoanki_cards') || '[]');
    let currentCard = null;

    function save() {
      localStorage.setItem('neoanki_cards', JSON.stringify(cards));
    }

    function getDueCards() {
      const now = Date.now();
      return cards.filter(c => (c.due || 0) <= now);
    }

    function renderStudy() {
      const due = getDueCards();
      document.getElementById('stats').textContent = `بطاقات مستحقة: ${due.length} | إجمالي: ${cards.length}`;
      document.getElementById('card-back').classList.add('hidden');
      document.getElementById('rate-row').classList.add('hidden');
      document.getElementById('show-btn').classList.remove('hidden');

      if (!due.length) {
        currentCard = null;
        document.getElementById('card-front').textContent = 'خلصت مراجعة النهارده! أضف بطاقات جديدة بالأسفل.';
        document.getElementById('show-btn').classList.add('hidden');
        return;
      }

      currentCard = due[0];
      document.getElementById('card-front').textContent = currentCard.front;
      document.getElementById('card-back').textContent = currentCard.back;
    }

    function revealAnswer() {
      if (!currentCard) return;
      document.getElementById('card-back').classList.remove('hidden');
      document.getElementById('show-btn').classList.add('hidden');
      document.getElementById('rate-row').classList.remove('hidden');
    }

    function rateCard(quality) {
      if (!currentCard) return;
      const now = Date.now();
      let interval = currentCard.interval || 1;
      if (quality === 'again') {
        currentCard.due = now + 10 * 60 * 1000;
        currentCard.interval = 0.5;
      } else if (quality === 'hard') {
        currentCard.due = now + 12 * 60 * 60 * 1000;
        currentCard.interval = Math.max(0.5, interval * 0.8);
      } else {
        const nextDays = currentCard.reps ? Math.round(interval * 2.2) : 1;
        currentCard.due = now + nextDays * DAY;
        currentCard.interval = nextDays;
        currentCard.reps = (currentCard.reps || 0) + 1;
      }
      save();
      renderStudy();
    }

    function addCard() {
      const front = document.getElementById('q-input').value.trim();
      const back = document.getElementById('a-input').value.trim();
      if (!front || !back) return;
      cards.push({ id: Date.now(), front, back, due: Date.now(), interval: 1, reps: 0 });
      document.getElementById('q-input').value = '';
      document.getElementById('a-input').value = '';
      save();
      renderStudy();
    }

    renderStudy();
  </script>
</body>
</html>
