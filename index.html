<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeoAnki — FSRS</title>
  <style>
    :root {
      --bg: #07090f;
      --glass: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.14);
      --accent1: #a78bfa;
      --accent2: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --again: #fb7185;
      --hard: #fbbf24;
      --good: #34d399;
      --easy: #38bdf8;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Arabic", system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.42;
      z-index: 0;
      pointer-events: none;
    }
    .orb-a { width: 250px; height: 250px; background: var(--accent1); top: -60px; right: -60px; }
    .orb-b { width: 230px; height: 230px; background: var(--accent2); bottom: -50px; left: -50px; }

    .app {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: 20px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(22px);
    }

    .brand { font-weight: 800; font-size: 18px; }
    .stats { font-size: 12.5px; color: var(--muted); }

    .glass-card {
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(24px) saturate(155%);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .front-box { font-size: 23px; font-weight: 700; text-align: center; padding: 20px 8px; }
    .back-box {
      font-size: 19px;
      text-align: center;
      padding: 16px 8px;
      border-top: 1px solid var(--border);
      margin-top: 10px;
      color: #e2e8f0;
    }

    .btn-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 10px 6px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      line-height: 1.35;
    }

    .primary { background: linear-gradient(135deg, var(--accent1), var(--accent2)); color: #06080d; border: none; padding: 12px; font-size: 14px; }
    .r1 { border-color: rgba(251, 113, 133, 0.45); color: var(--again); }
    .r2 { border-color: rgba(251, 191, 36, 0.45); color: var(--hard); }
    .r3 { border-color: rgba(52, 211, 153, 0.45); color: var(--good); }
    .r4 { border-color: rgba(56, 189, 248, 0.45); color: var(--easy); }

    .sub-t { display: block; font-size: 11px; opacity: 0.85; margin-top: 2px; }

    input, textarea {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font-size: 15px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <div class="app">
    <header>
      <div class="brand">NeoAnki</div>
      <div class="stats" id="stats">مستحق: 0</div>
    </header>

    <div class="glass-card" id="study-panel">
      <div class="meta-bar" id="fsrs-meta">FSRS Active</div>
      <div class="front-box" id="card-front">لا توجد بطاقات مستحقة حالياً</div>
      <div class="back-box hidden" id="card-back"></div>
      <button class="primary" id="show-btn" style="width:100%" onclick="revealAnswer()">إظهار الإجابة</button>
      <div class="btn-grid-4 hidden" id="rate-row">
        <button class="r1" onclick="rateCard(1)">تاني<span class="sub-t" id="lbl-1"></span></button>
        <button class="r2" onclick="rateCard(2)">صعب<span class="sub-t" id="lbl-2"></span></button>
        <button class="r3" onclick="rateCard(3)">تمام<span class="sub-t" id="lbl-3"></span></button>
        <button class="r4" onclick="rateCard(4)">سهل<span class="sub-t" id="lbl-4"></span></button>
      </div>
    </div>

    <div class="glass-card">
      <div style="font-weight:700; margin-bottom:6px;">إضافة بطاقة جديدة</div>
      <input id="q-input" placeholder="الوجه الأمامي (سؤال أو كلمة)" />
      <textarea id="a-input" rows="2" placeholder="الوجه الخلفي (الإجابة أو المعنى)"></textarea>
      <button class="primary" style="width:100%; margin-top:10px;" onclick="addCard()">حفظ البطاقة</button>
    </div>
  </div>

  <script>
    const DAY = 86400000;
    const DESIRED_RETENTION = 0.9;
    const w = [0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01, 1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61];

    let cards = JSON.parse(localStorage.getItem('neoanki_fsrs_cards') || '[]');
    let currentCard = null;

    function save() {
      localStorage.setItem('neoanki_fsrs_cards', JSON.stringify(cards));
    }

    function clamp(val, min, max) {
      return Math.min(max, Math.max(min, val));
    }

    function intervalFromStability(s) {
      const factor = Math.pow(DESIRED_RETENTION, 1 / -0.5) - 1;
      const days = Math.max(1, Math.round(s * factor));
      return days;
    }

    function previewFSRS(card, rating, now = Date.now()) {
      const state = card.state || 'new';
      let d = card.difficulty ?? 5.0;
      let s = card.stability ?? 0;
      let reps = card.reps || 0;
      let lapses = card.lapses || 0;

      if (state === 'new' || s <= 0) {
        const initD = clamp(w[4] - Math.exp((rating - 1) * w[5]) + 1, 1, 10);
        const initS = Math.max(0.2, w[rating - 1] || 0.4);
        d = Number(initD.toFixed(2));
        s = Number(initS.toFixed(2));

        if (rating === 1) return { state: 'learning', difficulty: d, stability: s, due: now + 10 * 60 * 1000, label: '10 د', reps, lapses: lapses + 1 };

        if (rating === 3) return { state: 'review', difficulty: d, stability: Math.max(1, s), due: now + DAY, label: '1 ي', reps: reps + 1, lapses };
        const easyDays = Math.max(3, intervalFromStability(s * 1.4));
        return { state: 'review', difficulty: d, stability: s * 1.4, due: now + easyDays * DAY, label: `${easyDays} ي`, reps: reps + 1, lapses };
      }

      const elapsedDays = Math.max(0.01, (now - (card.lastReview || now)) / DAY);
      const retrievability = Math.pow(1 + (19 / 81) * (elapsedDays / Math.max(0.1, s)), -0.5);

      d = clamp(d - w[6] * (rating - 3), 1, 10);
      d = clamp(w[7] * 5.0 + (1 - w[7]) * d, 1, 10);

      if (rating === 1) {
        const nextS = Math.max(0.25, w[11] * Math.pow(d, -w[12]) * (Math.pow(s + 1, w[13]) - 1) * Math.exp((1 - retrievability) * w[14]));
        return {
          state: 'learning',
          difficulty: Number(d.toFixed(2)),
          stability: Number(nextS.toFixed(2)),
          due: now + 15 * 60 * 1000,
          label: '15 د',
          reps,
          lapses: lapses + 1
        };
      }

      const hardPenalty = rating === 2 ? w[15] : 1;
      const easyBonus = rating === 4 ? w[16] : 1;
      const nextS = s * (
        Math.exp(w[8]) *
        (11 - d) *
        Math.pow(s, -w[9]) *
        (Math.exp((1 - retrievability) * w[10]) - 1) *
        hardPenalty *
        easyBonus + 1
